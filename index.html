class=\"turn-face front\">\n          <div class=\"eyebrow\">School Profile<\/div><div class=\"rule\"><\/div>\n          <h2>About Our School<\/h2>\n          <p>Kauswagan National High School serves learners and the community of Kauswagan, Cagayan de Oro City, under the Department of Education – Region X.<\/p>\n          <h3>Our School Priorities<\/h3>\n          <ul><li>Quality teaching and learning<\/li><li>Inclusive learner support and development<\/li><li>Safe, clean, and child-friendly facilities<\/li><li>Transparent and accountable school management<\/li><\/ul>\n          <span class=\"page-number\">2<\/span>\n        <\/article>\n        <article class=\"turn-face back\">\n          <div class=\"eyebrow\">School Services<\/div><div class=\"rule\"><\/div>\n          <h2>Services &amp; Support<\/h2>\n          <p>School services support the academic, personal, and administrative needs of learners, parents, and personnel.<\/p>\n          <ul><li>Registrar and learner records<\/li><li>Guidance and student formation<\/li><li>Learning resources and library support<\/li><li>School finance and administrative services<\/li><li>Health, safety, and learner welfare<\/li><\/ul>\n          <span class=\"page-number\">3<\/span>\n        <\/article>\n      <\/div>\n    <\/section>\n  <\/div>\n  <div class=\"controls\">\n    <button id=\"openBtn\" type=\"button\">Open Book<\/button>\n    <button id=\"prevBtn\" type=\"button\" disabled>← Previous<\/button>\n    <span id=\"pageStatus\">Cover / Page 1<\/span>\n    <button id=\"nextBtn\" type=\"button\">Next Page →<\/button>\n  <\/div>\n  <p class=\"hint\">Click “Open Book” or “Next Page” to turn a page. You can also use the arrow keys.<\/p>\n<\/main>\n<footer>© Kauswagan National High School | School Information, Monitoring and Administrative Portal<\/footer>\n<script>\n(() => {\n  const turner = document.getElementById('turner');\n  const openBtn = document.getElementById('openBtn');\n  const prevBtn = document.getElementById( \/span>`\n    }\n  ];\n  let page = 0;\n  let currentTurn = 0;\n  const maxTurns = 1 + extraPages.length;\n  function update(){\n    prevBtn.disabled = page === 0;\n    nextBtn.disabled = page >= maxTurns;\n    openBtn.disabled = page !== 0;\n    openBtn.textContent = page === 0 ? 'Open Book' : 'Book Opened';\n    status.textContent = page === 0 ? 'Cover / Page 1' : `Pages ${page*2}–${page*2+1}`;\n  }\n  function setTurnContent(index){\n    const front = turner.querySelector('.front');\n    const back = turner.querySelector('.back');\n    if(index === 0){\n      front.innerHTML = `<div class=\"eyebrow\">School Profile<\/div><div class=\"rule\"><\/div><h2>About Our School<\/h2><p>Kauswagan National High School serves learners and the community of Kauswagan, Cagayan de Oro City, under the Department of Education – Region X.<\/p><h3>Our School Priorities<\/h3><ul><li>Quality teaching and learning<\/li><li>Inclusive learner support and development<\/li><li>Safe, clean, and child-friendly facilities<\/li><li>Transparent and accountable school management<\/li><\/ul><span class=\"page-number\">2<\/span>`;\n      back.innerHTML = `<div class=\"eyebrow\">School Services<\/div><div class=\"rule\"><\/div><h2>Services &amp; Support<\/h2><p>School services support the academic, personal, and administrative needs of learners, parents, and personnel.<\/p><ul><li>Registrar and learner records<\/li><li>Guidance and student formation<\/li><li>Learning resources and library support<\/li><li>School finance and administrative services<\/li><li>Health, safety, and learner welfare<\/li><\/ul><span class=\"page-number\">3<\/span>`;\n    } else {\n      const data = extraPages[index-1];\n      front.innerHTML = data.front;\n      back.innerHTML = data.back;\n    }\n  }\n  function next(){\n    if(page >= maxTurns) return;\n    if(page === 0){ page = 1; currentTurn = 0; turner.classList.add('flipped'); }\n    else {\n      // Reset the current sheet, then load the next one before turning it.\n      turner.classList.remove('flipped');\n      page++;\n      currentTurn++;\n      setTurnContent(currentTurn);\n      requestAnimationFrame(() => requestAnimationFrame(() => turner.classList.add('flipped')));\n    }\n    update();\n  }\n  function previous(){\n    if(page <= 0) return;\n    if(page === 1){ turner.classList.remove('flipped'); page = 0; }\n    else {\n      turner.classList.remove('flipped');\n      page--;\n      currentTurn--;\n      setTurnContent(currentTurn);\n      requestAnimationFrame(() => requestAnimationFrame(() => turner.classList.add('flipped')));\n    }\n    update();\n  }\n  openBtn.addEventListener('click', next);\n  nextBtn.addEventListener('click', next);\n  prevBtn.addEventListener('click', previous);\n  document.addEventListener('keydown', e => {\n    if(e.key === 'ArrowRight') next();\n    if(e.key === 'ArrowLeft') previous();\n  });\n  update();\n})();\n<\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n<title>Kauswagan National High School<\/title>\n\n<style>\n:root{--light-maroon:#7b3f4a;--maroon-dark:#5d2632;--border:#d5dbe3}\nmain,.title,.section,.intro,.quick{width:calc(100% - 40px);max-width:1440px;margin-left:auto;margin-right:auto;box-sizing:border-box}\nheader{background:var(--light-maroon)!important;color:#fff!important;border-bottom:3px solid var(--maroon-dark)}\nfooter{background:var(--light-maroon)!important;color:#fff!important;border-top:3px solid var(--maroon-dark)}\nfooter b,footer span{color:#fff!important}\nheader .republic,header .deped,header b,header small,header div{color:inherit}\n.sheet{width:100%;max-width:1440px;margin:0 auto;padding:0;box-sizing:border-box;overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:4px;overscroll-behavior:contain}\n.sheet iframe{display:block;width:100%!important;min-width:0!important;height:720px!important;border:0;margin:0;padding:0;box-sizing:border-box;overscroll-behavior:contain}\nhtml{scroll-behavior:smooth;scroll-padding-top:15px}\n#beis,#leave,#services,#resources,#about{scroll-margin-top:15px}\n@media (min-width:1500px){main,.title,.section,.intro,.quick{width:1440px;max-width:1440px}}\n@media (max-width:768px){main,.title,.section,.intro,.quick{width:calc(100% - 20px)}.sheet iframe{height:650px!important}}\n\n/* Default iframe (Tracking = normal size) */\n.sheet iframe{\n    display:block;\n    width:100% !important;\n    height:720px !important;\n    border:0;\n}\n\n/* Google Sheets only = 75% zoom */\n.sheet-zoom{\n    width:100%;\n    overflow:hidden;\n}\n\n.sheet-zoom iframe{\n    width:133.333333% !important;\n    height:960px !important;\n    border:0;\n    transform:scale(0.75);\n    transform-origin:top left;\n    margin-bottom:-240px; /* removes extra space from scaling */\n}\n\n/* Mobile */\n@media (max-width: 768px) {\n    .sheet iframe {\n        width: 133.333333% !important;\n        height: 867px !important;\n    }\n}\n\n\n/* PERSONNEL SERVICES DOWNLOADS */\n.personnel-downloads{\n    margin-top:18px;\n    display:grid;\n    grid-template-columns:repeat(4,1fr);\n    gap:14px;\n}\n.personnel-download{\n    display:flex;\n    flex-direction:column;\n    justify-content:space-between;\n    gap:12px;\n    padding:16px;\n    background:#fff;\n    border:1px solid #d5dbe3;\n    border-radius:8px;\n    box-sizing:border-box;\n}\n.personnel-download h4{\n    margin:0;\n    font-size:16px;\n}\n.personnel-download p{\n    margin:5px 0 0;\n    font-size:13px;\n    line-height:1.5;\n}\n.personnel-download .download-btn{\n    display:inline-block;\n    width:max-content;\n    padding:9px 14px;\n    border-radius:5px;\n    background:#7b3f4a;\n    color:#fff;\n    text-decoration:none;\n    font-weight:600;\n    font-size:13px;\n}\n.personnel-download .download-btn:hover{\n    background:#5d2632;\n}\n@media(max-width:1100px){\n    .personnel-downloads{grid-template-colu urn;\n        if (Math.abs((window.scrollY || 0) - savedY) > 1 ||\n            Math.abs((window.scrollX || 0) - savedX) > 1) {\n            window.scrollTo(savedX, savedY);\n        }\n    }\n\n    function lockPage() {\n        locked = true;\n        savePosition();\n\n        [0, 20, 50, 100, 200, 400, 700, 1200].forEach(function (ms) {\n            setTimeout(restorePosition, ms);\n        });\n    }\n\n    function unlockPage() {\n        locked = false;\n        clearTimeout(timer);\n    }\n\n    frames.forEach(function (frame) {\n        frame.addEventListener('pointerdown', lockPage, true);\n        frame.addEventListener('mousedown', lockPage, true);\n        frame.addEventListener('touchstart', lockPage, {capture:true, passive:true});\n\n        frame.addEventListener('focus', function () {\n            lockPage();\n        }, true);\n\n        frame.addEventListener('load', function () {\n            if (locked) {\n                setTimeout(restorePosition, 50);\n                setTimeout(restorePosition, 200);\n            }\n        });\n    });\n\n    /* Google Sheets can cause the browser window to move when it\n       receives focus. Immediately restore the saved position. */\n    window.addEventListener('blur', function () {\n        if (!locked) return;\n        [0, 30, 80, 150, 300].forEach(function (ms) {\n            setTimeout(restorePosition, ms);\n        });\n    });\n\n    /* Catch any parent-page movement caused by iframe interaction. */\n    window.addEventListener('scroll', function () {\n        if (!locked) return;\n        clearTimeout(timer);\n        timer = setTimeout(restorePosition, 0);\n    }, {passive:true});\n\n    /* Clicking outside the sheet returns control to normal page scrolling. */\n    document.addEventListener('pointerdown', function (event) {\n        if (!frames.some(function (frame) {\n            return event.target === frame;\n        })) {\n            unlockPage();\n        }\n    }, true);\n\n    /* Navigation links are allowed to move the main page. */\n    document.querySelectorAll('nav a, .quick a').forEach(function (link) {\n        link.addEventListener('click', function (event) {\n            const id = this.getAttribute('href');\n            const target = document.querySelector(id);\n            if (!target) return;\n\n            event.preventDefault();\n            unlockPage();\n\n            target.scrollIntoView({\n                behavior: 'smooth',\n                block: 'start'\n            });\n\n            if (history.pushState) {\n                history.pushState(null, '', id);\n            }\n        });\n    });\n})();\n<\/script>\n\n<\/body>\n<\/html>\n"];
const frames = [
  document.getElementById('frontPage'),
  document.getElementById('secondPage'),
  document.getElementById('thirdPage')
];
frames[0].srcdoc = documents[0];
frames[1].srcdoc = documents[1];

const pageNames = ['About KNHS', 'School Portal', 'KNHS Guidance System'];
let currentPage = 0;

function showPage(index) {
  currentPage = Math.max(0, Math.min(frames.length - 1, index));
  frames.forEach((frame, i) => frame.classList.toggle('active', i === currentPage));

  document.getElementById('prevBtn').disabled = currentPage === 0;
  document.getElementById('nextBtn').disabled = currentPage === frames.length - 1;
  document.getElementById('prevBtn').textContent =
    currentPage === 1 ? '← About KNHS' : '← ' + pageNames[currentPage - 1];
  document.getElementById('nextBtn').textContent =
    currentPage === frames.length - 2 ? 'KNHS Guidance System →' : 'School Portal →';
  document.getElementById('pageLabel').textContent =
    pageNames[currentPage] + ' · ' + (currentPage + 1) + ' of ' + frames.length;
}

document.getElementById('prevBtn').addEventListener('click', () => showPage(currentPage - 1));
document.getElementById('nextBtn').addEventListener('click', () => showPage(currentPage + 1));
</script></body></html>
